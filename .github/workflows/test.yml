name: Validate Stream
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Media test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick libimage-exiftool-perl
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          npm run check
          python3 -m py_compile lib/vision/*.py
      - name: Unit tests
        run: npm test
      - name: Docker deployment configuration
        run: npm run test:compose
      - name: Install browser test engine
        run: npx playwright install --with-deps chromium
      - name: Browser regression checks
        timeout-minutes: 8
        run: npm run test:browser
      - name: Independent node browser checks
        timeout-minutes: 8
        run: npm run test:nodes
