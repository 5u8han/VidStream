name: Validate Stream
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Media test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick libimage-exiftool-perl
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          npm run check
          python3 -m py_compile lib/vision/*.py
      - name: Unit tests
        run: npm test
      - name: Docker deployment configuration
        run: npm run test:compose
      - name: Install browser test engine
        run: npx playwright install --with-deps chromium
      - name: Browser regression checks
        timeout-minutes: 8
        run: npm run test:browser
      - name: Independent node browser checks
        timeout-minutes: 8
        run: npm run test:nodes
