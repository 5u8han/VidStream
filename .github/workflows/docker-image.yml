name: Publish VidStream to Docker Hub

on:
  workflow_run:
    workflows: [Validate Stream]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: vidstream-docker-hub-main
      cancel-in-progress: false
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check Docker Hub settings
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Configure the DOCKERHUB_USERNAME variable and a write-enabled DOCKERHUB_TOKEN secret.'
            exit 1
          fi
          printf 'image=docker.io/%s/vidstream\n' "$DOCKERHUB_USERNAME" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build and test both architectures
        run: |
          container=''
          cleanup() {
            if [[ -n "$container" ]]; then docker rm -f "$container" >/dev/null || true; fi
          }
          trap cleanup EXIT
          for arch in amd64 arm64; do
            platform="linux/$arch"
            image="vidstream-image-check:$arch"
            docker buildx build --pull --platform "$platform" --load --tag "$image" \
              --build-arg "VIDSTREAM_REVISION=$TESTED_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$TESTED_SHA" .

            compose_file="$RUNNER_TEMP/vidstream-$arch.yaml"
            docker run --rm --platform "$platform" "$image" \
              node scripts/setup-compose.js "$image" 8080 light-table -- /sample-media > "$compose_file"
            docker compose --file "$compose_file" config --quiet

            container=$(docker run --detach --platform "$platform" \
              --env ADMIN_PASSWORD=image-test-only --env WATCH_FOR_CHANGES=0 \
              --publish 127.0.0.1::4000 "$image")
            port=$(docker port "$container" 4000/tcp)
            if ! curl --fail --silent --show-error --max-time 5 \
              --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
              "http://$port/health" > /dev/null; then
              docker logs "$container"
              exit 1
            fi
            cleanup
            container=''
          done

      - name: Verify the tested commit is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" == "$TESTED_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is on main. Skip this publication.'
          fi

      - name: Sign in to Docker Hub
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested images and their combined manifest
        if: steps.current.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
        run: |
          for arch in amd64 arm64; do
            tag="$IMAGE:sha-$TESTED_SHA-$arch"
            docker tag "vidstream-image-check:$arch" "$tag"
            docker push "$tag"
          done
          docker buildx imagetools create \
            --tag "$IMAGE:latest" --tag "$IMAGE:sha-$TESTED_SHA" \
            "$IMAGE:sha-$TESTED_SHA-amd64" "$IMAGE:sha-$TESTED_SHA-arm64"
