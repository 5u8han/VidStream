services:
  stream:
    ports: !reset []
    environment:
      URL: "https://${STREAM_TLS_HOST:?Set STREAM_TLS_HOST to the certificate hostname.}"
      TRUST_PROXY: "1"

  https:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      stream:
        condition: service_healthy
    environment:
      STREAM_TLS_HOST: "${STREAM_TLS_HOST:?Set STREAM_TLS_HOST to the certificate hostname.}"
    ports:
      - target: 80
        published: "80"
        host_ip: "${STREAM_TLS_BIND:-127.0.0.1}"
      - target: 443
        published: "443"
        host_ip: "${STREAM_TLS_BIND:-127.0.0.1}"
    volumes:
      - type: bind
        source: "${STREAM_TLS_CONFIG:-./deploy/Caddyfile}"
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${STREAM_TLS_CERT_DIR:?Set STREAM_TLS_CERT_DIR to the private directory containing fullchain.pem and privkey.pem.}"
        target: /run/vidstream-tls
        read_only: true
        bind:
          create_host_path: false
