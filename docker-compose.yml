services:
  stream:
    build:
      context: .
      args:
        INSTALL_AI_STACK: ${STREAM_AI_STACK:-false}
        AI_ACCELERATOR: ${STREAM_AI_ACCELERATOR:-cpu}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - target: 4000
        published: "${STREAM_HTTP_PORT:-80}"
        host_ip: "${STREAM_HTTP_BIND:-127.0.0.1}"
    volumes:
      - stream-cache:/app/.cache
      - stream-data:/app/data
      - stream-originals:/app/originals
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      URL: "${URL:?Run bash ./Start-Here.sh or Start-Here.bat for guided setup. For manual Compose, set URL in .env.}"
      MEDIA_DIR: /media/original
      CACHE_DIR: /app/.cache
      DATA_DIR: /app/data
      ORIGINALS_DIR: /app/originals/original
      STREAM_MEDIA_PATH: ""
      STREAM_ORIGINALS_PATH: ""
    env_file:
      - .env
    mem_limit: ${STREAM_MEM_LIMIT:-2g}
    memswap_limit: ${STREAM_MEM_LIMIT:-2g}

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    depends_on:
      - stream
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]

  rclone:
    image: rclone/rclone:latest
    restart: unless-stopped
    cap_add: ["SYS_ADMIN"]
    devices: ["/dev/fuse"]
    security_opt: ["apparmor:unconfined"]
    volumes:
      - ./rclone.conf:/config/rclone/rclone.conf:ro
      - rclone-vfs-cache:/cache
    command: >
      mount remote:path /data
      --allow-other
      --vfs-cache-mode full
      --vfs-cache-max-size 20G
      --vfs-cache-max-age 72h
      --dir-cache-time 1h
      --read-only
    profiles: ["remote"]

volumes:
  stream-data:
  stream-cache:
  stream-originals:
  rclone-vfs-cache:
