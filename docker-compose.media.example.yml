# Copy to docker-compose.media.local.yml and replace each source path.
# Use after the base and any existing storage overrides. See docs/MOUNTED_FOLDERS.md.
services:
  stream:
    volumes:
      # Edit this first entry for the folder you want to open at sign-in.
      - type: bind
        source: "/replace-with-your-path/Collection A"
        target: &primary_media "/media/collections/Collection A"
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "/replace-with-your-path/Collection B"
        target: "/media/collections/Collection B"
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "/replace-with-your-path/Collection C"
        target: "/media/collections/Collection C"
        read_only: true
        bind:
          create_host_path: false
    environment:
      MEDIA_DIR: /media/collections
      MEDIA_FOLDER_MODE: mounted
      MEDIA_PRIMARY_MOUNT: *primary_media
