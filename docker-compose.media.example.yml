services:
  stream:
    volumes:
      - type: bind
        source: "/replace-with-your-path/Collection A"
        target: &primary_media "/media/collections/Collection A"
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "/replace-with-your-path/Collection B"
        target: "/media/collections/Collection B"
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "/replace-with-your-path/Collection C"
        target: "/media/collections/Collection C"
        read_only: true
        bind:
          create_host_path: false
    environment:
      MEDIA_DIR: /media/collections
      MEDIA_FOLDER_MODE: mounted
      MEDIA_PRIMARY_MOUNT: *primary_media
